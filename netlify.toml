[build]
  base = "client"
  command = "npm install --legacy-peer-deps && npx vite build --config ../vite.config.netlify.ts"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "20"
  VITE_SITE_URL = "https://www.novaxone.com"

# Edge Function pour les balises Open Graph (crawlers LinkedIn, Facebook, Twitter…)
[[edge_functions]]
  function = "og-meta"
  path = "/blog/*"

[[edge_functions]]
  function = "og-meta"
  path = "/en/blog/*"

# Redirects pour le routage React (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache pour les assets statiques
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache pour les images
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
